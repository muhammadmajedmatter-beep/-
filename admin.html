<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    {{PC}}
    .login-overlay{position:fixed;inset:0;background:#050508f2;display:flex;align-items:center;justify-content:center;z-index:1000}
    .login-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:370px;width:100%;text-align:center}
    .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--border);background:#050508d1;position:sticky;top:0;z-index:100}
    .logo{font-size:18px;font-weight:900}
    .logo span{background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .tabs-bar{display:flex;gap:6px;padding:10px 22px;border-bottom:1px solid var(--border);overflow-x:auto}
    .tab{flex-shrink:0;padding:8px 14px;border-radius:10px;background:transparent;border:none;color:var(--muted);font-weight:700;cursor:pointer;font-size:12px}
    .tab.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff}
    .content{padding:20px 22px;max-width:1120px;margin:0 auto}
    .tab-panel{display:none}
    .tab-panel.active{display:block}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
    .stat-val{font-size:24px;font-weight:900}
    .table-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow-x:auto;margin-top:12px}
    table{width:100%;border-collapse:collapse;text-align:right}
    th{background:#ffffff09;padding:10px;color:var(--muted);font-size:12px}
    td{padding:10px;border-bottom:1px solid #ffffff09;font-size:13px}
    .btn-sm{padding:6px 10px;font-size:11px;border-radius:8px;margin:2px}
    .rbox{display:none;margin-top:8px;padding:10px;background:#0009;border:1px solid var(--border);border-radius:10px}
    .rbox.open{display:block}
  </style>
</head>
<body>
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <h2 style="margin-bottom:14px">🔒 Admin</h2>
      <input type="text" id="adminUser" placeholder="Username">
      <input type="password" id="adminPass" placeholder="Password">
      <button class="btn btn-primary" style="width:100%" onclick="doAdminLogin()">دخول</button>
    </div>
  </div>

  <div id="adminApp" style="display:none">
    <div class="topbar">
      <div class="logo">⚡ <span>SLAP AURA ADMIN</span></div>
      <button class="btn btn-ghost" style="padding:7px 12px;font-size:12px" onclick="location.href='/'">← الموقع</button>
    </div>

    <div class="tabs-bar">
      <button class="tab active" data-tab="dash">📊 القيادة</button>
      <button class="tab" data-tab="roles">🎖️ الرتب</button>
      <button class="tab" data-tab="subs">💵 الاشتراكات</button>
      <button class="tab" data-tab="bans">🛡️ الحظر</button>
      <button class="tab" data-tab="keys">🔑 المفاتيح</button>
      <button class="tab" data-tab="players">👥 اللاعبين</button>
      <button class="tab" data-tab="tickets">🎫 التذاكر</button>
      <button class="tab" data-tab="finder">🔍 Finder</button>
    </div>

    <div class="content">
      <div class="tab-panel active" id="tab-dash">
        <div class="stats">
          <div class="stat"><label>المفاتيح</label><div class="stat-val" style="color:#818cf8" id="s-keys">0</div></div>
          <div class="stat"><label>الحظر</label><div class="stat-val" style="color:#f87171" id="s-bans">0</div></div>
          <div class="stat"><label>نشط</label><div class="stat-val" style="color:#fbbf24" id="s-active">0</div></div>
          <div class="stat"><label>مستخدمين</label><div class="stat-val" style="color:#10b981" id="s-users">0</div></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-roles">
        <div class="card" style="max-width:560px;margin-bottom:14px">
          <h3>🎖️ تعيين رتبة</h3>
          <input type="text" id="roleTarget" placeholder="البريد أو ID">
          <select id="roleSelect">
            <option value="member">Member</option>
            <option value="vip">VIP</option>
            <option value="moderator">Moderator</option>
            <option value="admin">Admin</option>
            <option value="owner">Owner</option>
          </select>
          <button class="btn btn-primary" style="width:100%" onclick="assignRole()">💾 حفظ</button>
          <div id="roleResult" style="margin-top:8px;font-weight:800"></div>
        </div>
        <div class="table-box">
          <table><thead><tr><th>المستخدم</th><th>الرتبة</th><th>سريع</th></tr></thead><tbody id="t-roles"></tbody></table>
        </div>
      </div>

      <div class="tab-panel" id="tab-subs">
        <div class="card" style="max-width:560px;margin-bottom:14px">
          <h3>🎁 إهداء اشتراك</h3>
          <input type="text" id="subEmail" placeholder="البريد أو ID">
          <select id="subTier">
            <option value="pro">Pro</option>
            <option value="lifetime">Lifetime</option>
          </select>
          <input type="number" id="subDays" min="0" placeholder="الأيام">
          <input type="text" id="subNote" maxlength="160" placeholder="رسالة">
          <button class="btn btn-primary" style="width:100%" onclick="assignTier()">🎁 تفعيل</button>
          <div id="subResult" style="margin-top:8px;font-weight:800"></div>
        </div>
        <div class="card" style="max-width:560px">
          <h3>💵 إضافة رصيد ($)</h3>
          <input type="text" id="usdTarget" placeholder="البريد أو ID">
          <input type="number" id="usdAmt" min="0.5" step="0.5" placeholder="المبلغ">
          <input type="text" id="usdNote" maxlength="160" placeholder="رسالة">
          <button class="btn btn-success" style="width:100%" onclick="addUsdBalance()">💵 إضافة</button>
          <div id="usdResult" style="margin-top:8px;font-weight:800"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-bans">
        <div class="card" style="max-width:460px">
          <h3>🔨 حظر</h3>
          <select id="banType">
            <option value="ip">IP</option>
            <option value="user">User ID</option>
            <option value="hwid">HWID</option>
          </select>
          <input type="text" id="banTarget" placeholder="الهدف">
          <input type="number" id="banDays" value="30">
          <input type="text" id="banReason" placeholder="السبب">
          <button class="btn btn-danger" style="width:100%" onclick="doBan()">تنفيذ</button>
        </div>
        <div class="table-box">
          <table><thead><tr><th>النوع</th><th>الهدف</th><th>السبب</th><th>فك</th></tr></thead><tbody id="t-bans"></tbody></table>
        </div>
      </div>

      <div class="tab-panel" id="tab-keys">
        <div class="card" style="max-width:720px;margin-bottom:14px">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <input type="text" id="k-user" placeholder="إيميل أو ID" style="margin:0;flex:2;min-width:160px">
            <input type="number" id="k-days" value="30" min="0" style="margin:0;flex:1;min-width:90px">
            <button class="btn btn-success btn-sm" onclick="createAdminKey()">➕ إصدار</button>
          </div>
          <div id="k-created" style="margin-bottom:8px;font-weight:800;color:#10b981"></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <input type="text" id="k-search" placeholder="LV-XXXX" style="margin:0;flex:2;min-width:160px">
            <button class="btn btn-primary btn-sm" onclick="kAct(kSearchVal(),'set_days',kDaysVal())">⏱️ مدة</button>
            <button class="btn btn-ghost btn-sm" onclick="kAct(kSearchVal(),'toggle')">⏸️/▶️</button>
            <button class="btn btn-success btn-sm" onclick="kAct(kSearchVal(),'renew',kDaysVal()||30)">🔄 تجديد</button>
            <button class="btn btn-danger btn-sm" onclick="kAct(kSearchVal(),'delete')">🗑️ مسح</button>
            <button class="btn btn-ghost btn-sm" onclick="kAct('_','clean')">🧹 تنظيف</button>
          </div>
        </div>
        <div class="table-box">
          <table><thead><tr><th>المفتاح</th><th>الحالة</th><th>المدة</th><th>الباقة</th><th>تحكم</th></tr></thead><tbody id="t-keys"></tbody></table>
        </div>
      </div>

      <div class="tab-panel" id="tab-players">
        <div class="table-box">
          <table><thead><tr><th>الاسم</th><th>ID</th><th>الرتبة</th><th>IP</th></tr></thead><tbody id="t-players"></tbody></table>
        </div>
      </div>

      <div class="tab-panel" id="tab-tickets">
        <div class="table-box">
          <table><thead><tr><th>User</th><th>Email</th><th>الرسالة</th><th>رد</th></tr></thead><tbody id="t-tickets"></tbody></table>
        </div>
      </div>

      <div class="tab-panel" id="tab-finder">
        <div class="table-box">
          <table><thead><tr><th>JobId</th><th>لاعبين</th><th>محدث</th></tr></thead><tbody id="t-finder"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
    var au='',ap='';
    function toast(m,t='ok'){toast.textContent=m;toast.className='toast show '+t;setTimeout(()=>toast.classList.remove('show'),3200)}
    function kSearchVal(){return document.getElementById('k-search').value.trim()}
    function kDaysVal(){var v=parseInt(document.getElementById('k-days').value,10);return isNaN(v)?30:Math.max(0,v)}
    function fmtExp(exp){if(exp===0)return'♾️ دائم';if(!exp)return'-';var d=Math.ceil((exp-Date.now())/864e5);return d>0?d+' يوم':'منتهي'}
    async function doAdminLogin(){au=adminUser.value;ap=adminPass.value;if(!au||!ap)return toast('ادخل البيانات','err');var r=await api('stats');if(!r||r.status===401)return;loginOverlay.style.display='none';adminApp.style.display='block';var d=await r.json();document.getElementById('s-keys').textContent=d.stats.keys||0;document.getElementById('s-bans').textContent=d.stats.bans||0;document.getElementById('s-active').textContent=d.stats.active_bans||0;document.getElementById('s-users').textContent=d.stats.users||0}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('tab-'+b.dataset.tab).classList.add('active');loadCurrent()});
    async function api(c,e=''){var r=await fetch('/admin?user='+encodeURIComponent(au)+'&pass='+encodeURIComponent(ap)+'&cmd='+c+e);if(r.status===401){toast('بيانات غلط','err');adminApp.style.display='none';loginOverlay.style.display='flex';return null}return r}
    async function loadCurrent(){var t=document.querySelector('.tab.active').dataset.tab;if(t==='dash'){var r=await api('stats');if(!r)return;var d=await r.json();document.getElementById('s-keys').textContent=d.stats.keys||0;document.getElementById('s-bans').textContent=d.stats.bans||0;document.getElementById('s-active').textContent=d.stats.active_bans||0;document.getElementById('s-users').textContent=d.stats.users||0}if(t==='roles'){var r=await api('all_roles');if(!r)return;var d=await r.json();document.getElementById('t-roles').innerHTML=(d.roles||[]).map(x=>'<tr><td>'+x.target+'</td><td><span class="role-badge" style="color:'+x.color+'">'+x.emoji+' '+x.label+'</span></td><td><button class="btn btn-sm btn-ghost" onclick="quickRole(\''+x.target+'\',\'vip\')">VIP</button><button class="btn btn-sm btn-ghost" onclick="quickRole(\''+x.target+'\',\'admin\')">Admin</button><button class="btn btn-sm btn-danger" onclick="quickRole(\''+x.target+'\',\'member\')">إزالة</button></td></tr>').join('')||'<tr><td colspan="3" style="text-align:center">لا يوجد</td></tr>'}if(t==='bans'){var r=await api('all_bans');if(!r)return;var d=await r.json();document.getElementById('t-bans').innerHTML=d.bans.filter(b=>!b.unbanned).map(b=>'<tr><td>'+b.type+'</td><td>'+b.target+'</td><td>'+b.reason+'</td><td><button class="btn btn-sm btn-success" onclick="unban(\''+b.type+'\',\''+b.target+'\')">فك</button></td></tr>').join('')||'<tr><td colspan="4" style="text-align:center">لا يوجد</td></tr>'}if(t==='keys'){var r=await api('all_keys');if(!r)return;var d=await r.json();document.getElementById('t-keys').innerHTML=(d.keys||[]).map(k=>{var st=k.disabled?'<span style="color:#ef4444;font-weight:800">⏸️ متوقف</span>':'<span style="color:#10b981;font-weight:800">▶️ نشط</span>';return'<tr><td><code>'+k.key+'</code></td><td>'+st+'</td><td>'+fmtExp(k.expiresAt)+'</td><td>'+(k.tier||'-')+'</td><td><button class="btn btn-sm btn-primary" onclick="kAct(\''+k.key+'\',\'set_days\',kDaysVal())">⏱️</button><button class="btn btn-sm btn-ghost" onclick="kAct(\''+k.key+'\',\'toggle\')">⏸️</button><button class="btn btn-sm btn-success" onclick="kAct(\''+k.key+'\',\'renew\',kDaysVal()||30)">🔄</button><button class="btn btn-sm btn-danger" onclick="kAct(\''+k.key+'\',\'delete\')">🗑️</button></td></tr>'}).join('')||'<tr><td colspan="5" style="text-align:center">لا يوجد</td></tr>'}if(t==='players'){var r=await api('active_players');if(!r)return;var d=await r.json();document.getElementById('t-players').innerHTML=Object.entries(d.players||{}).map(([id,p])=>'<tr><td>'+p.name+'</td><td>'+id+'</td><td>'+(p.role||'member')+'</td><td>'+p.ip+'</td></tr>').join('')||'<tr><td colspan="4" style="text-align:center">لا يوجد</td></tr>'}if(t==='tickets'){var r=await api('tickets');if(!r)return;var d=await r.json();document.getElementById('t-tickets').innerHTML=d.tickets.map((tk,i)=>'<tr><td>'+tk.userId+'</td><td>'+(tk.email||'-')+'</td><td>'+tk.msg+'<div class="rbox" id="rb_'+i+'"><input type="text" id="ri_'+i+'" placeholder="اكتب ردك..." style="margin:0 0 8px 0;padding:8px"><button class="btn btn-sm btn-success" onclick="sendReply(\''+encodeURIComponent(tk.id||'')+'\',\''+encodeURIComponent(tk.email||'')+'\',\'ri_'+i+'\')">إرسال</button><button class="btn btn-sm btn-ghost" onclick="toggleReply(\'rb_'+i+'\')">إلغاء</button></div></td><td><button class="btn btn-sm btn-primary" onclick="toggleReply(\'rb_'+i+'\')">💬 رد</button></td></tr>').join('')||'<tr><td colspan="4" style="text-align:center">لا يوجد</td></tr>'}if(t==='finder'){var r=await api('finder_stats');if(!r)return;var d=await r.json();document.getElementById('t-finder').innerHTML=d.servers.map(s=>'<tr><td><code>'+s.jobId.slice(0,10)+'</code></td><td>'+s.players+'/'+s.maxPlayers+'</td><td>'+s.ageSec+'s</td></tr>').join('')||'<tr><td colspan="3" style="text-align:center">لا يوجد</td></tr>'}}
    function toggleReply(id){var el=document.getElementById(id);if(!el)return;el.classList.toggle('open');var inp=el.querySelector('input');if(inp&&el.classList.contains('open'))inp.focus()}
    async function sendReply(tidEnc,emEnc,inpId){var inp=document.getElementById(inpId),rp=inp?inp.value.trim():'';if(!rp)return toast('اكتب الرد أولاً','err');var r=await api('reply_ticket','&id='+tidEnc+'&email='+emEnc+'&reply='+encodeURIComponent(rp));if(!r)return;var d=await r.json();if(d.success){toast('تم الإرسال ✅');loadCurrent()}else toast(d.message||'فشل ❌','err')}
    async function createAdminKey(){var u=document.getElementById('k-user').value.trim(),days=kDaysVal(),r=await api('create_key','&target='+encodeURIComponent(u)+'&days='+days);if(!r)return;var d=await r.json(),out=document.getElementById('k-created');out.style.color=d.success?'#10b981':'#ef4444';out.textContent=d.success?'✅ المفتاح: '+d.key:'❌ '+(d.message||'فشل');if(d.success){toast('تم الإصدار ✅');document.getElementById('k-search').value=d.key;loadCurrent()}}
    async function kAct(k,act,days){if(act!=='clean'&&!k)return toast('ادخل المفتاح','err');var r=await api('key_action','&key='+encodeURIComponent(k||'_')+'&act='+act+(days!==undefined?'&days='+days:''));if(!r)return;var d=await r.json();toast(d.message||(d.success?'تم ✅':'فشل'),d.success?'ok':'err');loadCurrent()}
    async function assignRole(){var target=roleTarget.value.trim(),role=roleSelect.value,res=roleResult;if(!target)return res.textContent='ادخل البريد أو ID';var r=await api('assign_role','&target='+encodeURIComponent(target)+'&role='+encodeURIComponent(role));if(!r)return;var d=await r.json();res.style.color=d.success?'#10b981':'#ef4444';res.textContent=d.success?'✅ تم تعيين '+role:'❌ '+(d.message||'فشل');if(d.success){toast('تم الحفظ ✅');roleTarget.value='';loadCurrent()}}
    async function quickRole(t,r0){await api('assign_role','&target='+encodeURIComponent(t)+'&role='+r0);toast('تم التحديث ✅');loadCurrent()}
    async function assignTier(){var em=subEmail.value.trim(),tier=subTier.value,dy=subDays.value.trim(),nt=subNote.value.trim(),res=subResult;if(!em)return res.textContent='ادخل الإيميل أو ID';var r=await api('assign_tier','&email='+encodeURIComponent(em)+'&tier='+tier+(dy!==''?'&days='+encodeURIComponent(dy):'')+(nt?'&note='+encodeURIComponent(nt):''));if(!r)return;var d=await r.json();res.style.color=d.success?'#10b981':'#ef4444';res.textContent=d.success?'✅ تم التفعيل! المفتاح: '+d.key:'❌ '+(d.message||'فشل');if(d.success)toast('🎁 تم الإرسال!')}
    async function addUsdBalance(){var tg=document.getElementById('usdTarget').value.trim(),amt=parseFloat(document.getElementById('usdAmt').value),nt=document.getElementById('usdNote').value.trim(),res=document.getElementById('usdResult');if(!tg||!amt||amt<=0){res.style.color='#ef4444';res.textContent='ادخل المستخدم والمبلغ';return}var r=await api('add_usd','&target='+encodeURIComponent(tg)+'&amount='+encodeURIComponent(amt)+(nt?'&note='+encodeURIComponent(nt):''));if(!r)return;var d=await r.json();res.style.color=d.success?'#10b981':'#ef4444';res.textContent=d.success?'✅ أُضيف $'+Number(d.amount).toFixed(2)+' | الرصيد: $'+Number(d.balance).toFixed(2):'❌ '+(d.message||'فشل');if(d.success){toast('💵 تمت الإضافة!');document.getElementById('usdAmt').value='';document.getElementById('usdNote').value=''}}
    async function doBan(){await api('ban','&type='+banType.value+'&target='+banTarget.value+'&days='+banDays.value+'&reason='+banReason.value);toast('تم الحظر ✅');loadCurrent()}
    async function unban(t,v){await api('unban','&type='+t+'&target='+v);toast('تم الفك ✅');loadCurrent()}
  </script>
</body>
</html>
